# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release
on:
  release:
    types:
      - published
permissions:
  attestations: write
  contents: read
  id-token: write
defaults:
  run:
    shell: bash
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_NOLOGO: true
jobs:
  release:
    if: github.repository == 'vezel-dev/zig-sdk'
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: doc/package.json
      - name: Build packages
        run: |
          ./cake pack-core
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          user: alexrp
      - name: Upload packages
        env:
          NUGET_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          ./cake upload-core-nuget --exclusive
      - name: Attest packages
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: out/pkg/release/*.nupkg
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ github.workflow }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            out/log
            out/pkg
